        <aside class="home-filter-sidebar" aria-label="Részletes keresés">
          <div class="home-filter-card">
            <h2 class="home-filter-title">Keresés</h2>
            <form id="home-filter-form" class="home-filter-form">
              <input type="hidden" name="uzemanyag_quick" id="filter-uzemanyag-quick" value="" />
              <div class="home-filter-fuel-btns" role="group" aria-label="Üzemanyag gyorsválasztó">
                <button type="button" class="home-filter-fuel-btn" data-fuel-quick="benzin">Benzin</button>
                <button type="button" class="home-filter-fuel-btn" data-fuel-quick="diesel">Diesel</button>
                <button type="button" class="home-filter-fuel-btn" data-fuel-quick="hybrid">Hybrid</button>
                <button type="button" class="home-filter-fuel-btn" data-fuel-quick="benzin-gaz">Benzin/Gáz</button>
                <button type="button" class="home-filter-fuel-btn" data-fuel-quick="elektromos">Elektromos</button>
              </div>
              <label class="home-filter-field">
                <span class="home-filter-label">Márka</span>
                <select id="filter-gyartmany" name="gyartmany"><option value="">Mindegy</option></select>
              </label>
              <label class="home-filter-field">
                <span class="home-filter-label">Modell</span>
                <select id="filter-modell" name="modell"><option value="">Mindegy</option></select>
              </label>
              <label class="home-filter-field">
                <span class="home-filter-label">Kivitel</span>
                <select id="filter-kivitel" name="kivitel"><option value="">Mindegy</option></select>
              </label>
              <label class="home-filter-field">
                <span class="home-filter-label">Üzemanyag</span>
                <select id="filter-uzemanyag" name="uzemanyag"><option value="">Mindegy</option></select>
              </label>

              <div class="home-filter-field">
                <span class="home-filter-label">Évjárat</span>
                <div class="home-filter-range">
                  <select name="ev_tol" aria-label="Évjárat tól"><option value="">-tól</option></select>
                  <select name="ev_ig" aria-label="Évjárat ig"><option value="">-ig</option></select>
                </div>
              </div>

              <div class="home-filter-field">
                <span class="home-filter-label">Vételár (Ft)</span>
                <div class="home-filter-range">
                  <input type="number" name="ar_tol" placeholder="-tól" min="0" step="100000" />
                  <input type="number" name="ar_ig" placeholder="-ig" min="0" step="100000" />
                </div>
              </div>

              <label class="home-filter-field">
                <span class="home-filter-label">Típusjel</span>
                <input type="text" name="tipus" placeholder="pl. 320d" />
              </label>

              <div class="home-filter-field">
                <span class="home-filter-label">Km. óra állás</span>
                <div class="home-filter-range">
                  <input type="number" name="km_tol" placeholder="-tól" min="0" step="1000" />
                  <input type="number" name="km_ig" placeholder="-ig" min="0" step="1000" />
                </div>
              </div>

              <div class="home-filter-field">
                <span class="home-filter-label">Heng. tart. (cm³)</span>
                <div class="home-filter-range">
                  <input type="number" name="ccm_tol" placeholder="-tól" min="0" step="100" />
                  <input type="number" name="ccm_ig" placeholder="-ig" min="0" step="100" />
                </div>
              </div>

              <label class="home-filter-field">
                <span class="home-filter-label">Állapot</span>
                <select id="filter-allapot" name="allapot"><option value="">Mindegy</option></select>
              </label>
              <label class="home-filter-field">
                <span class="home-filter-label">Ajtók száma</span>
                <select id="filter-ajtok" name="ajtok"><option value="">Mindegy</option></select>
              </label>
              <label class="home-filter-field">
                <span class="home-filter-label">Ülések száma</span>
                <select id="filter-ulesek" name="ulesek"><option value="">Mindegy</option></select>
              </label>

              <fieldset class="home-filter-checks">
                <legend class="home-filter-label">Felszereltség</legend>
                <label><input type="checkbox" name="feat_automata" /> automata</label>
                <label><input type="checkbox" name="feat_tempomat" /> tempomat</label>
                <label><input type="checkbox" name="feat_osszker" /> összkerékmeghajtás</label>
                <label><input type="checkbox" name="feat_alufelni" /> alufelni</label>
                <label><input type="checkbox" name="feat_elektromos_ablak" /> elektromos ablak</label>
                <label><input type="checkbox" name="feat_vonohorog" /> vonóhorog</label>
                <label><input type="checkbox" name="feat_isofix" /> ISOFIX rendszer</label>
                <label><input type="checkbox" name="feat_esp" /> ESP (menetstabilizátor)</label>
                <label><input type="checkbox" name="feat_szervizkonyv" /> szervizkönyv</label>
                <label><input type="checkbox" name="feat_veteran" /> veterán</label>
              </fieldset>

              <div class="home-filter-actions">
                <button type="button" class="home-filter-reset" id="filter-reset">Keresési feltételek törlése</button>
              </div>
            </form>
          </div>
        </aside>
