<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="autosweb-version" content="auth20260725reg" />
    <title>Belépés — Add el autod.hu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=auth20260725" />
    <link rel="stylesheet" href="/css/site-app.css?v=auth20260725" />
  </head>
  <body class="site-app login-page" data-site-page="belepes" data-auth-init="manual">
    <div class="local-banner">LOCALHOST — belépés a hirdetésfeladáshoz</div>

    <header class="site-header site-app-header">
      <div class="site-app-header-inner">
        <a class="site-app-logo" href="/">Add el autod.hu</a>
        <nav class="import-nav site-app-nav" aria-label="Oldalak">
          <a class="import-nav-link" href="/">Főoldal</a>
          <a class="import-nav-link" href="/import.html">Import</a>
          <a class="import-nav-link" href="/listings.html">Hirdetések</a>
          <a class="import-nav-link" href="/fugveny.html">Függvény</a>
        </nav>
        <div class="header-actions site-header-actions">
          <a class="site-header-btn site-header-btn--ghost" href="/hirdetesfeladas.html" data-auth-guard>Hirdetésfeladás</a>
          <a class="site-header-btn site-header-btn--ghost" href="/regisztracio.html" data-auth-register>Regisztráció</a>
          <a class="site-header-btn site-header-btn--ghost" href="/belepes.html" data-auth-login>Belépés</a>
        </div>
      </div>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <h1 class="login-title" id="login-title">Belépés</h1>
        <p class="login-lead">A hirdetésfeladáshoz jelentkezz be a fiókodba.</p>
        <form id="login-form" class="login-form">
          <label class="login-field">
            <span class="login-label">Email</span>
            <input type="email" name="email" autocomplete="username" required placeholder="pelda@email.hu" />
          </label>
          <label class="login-field">
            <span class="login-label">Jelszó</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button type="submit" class="site-header-btn site-header-btn--primary login-submit">Belépés</button>
        </form>
        <p class="login-hint">Nincs még fiókod? <a href="/regisztracio.html">Regisztráció</a> · Localhost demó</p>
      </section>
    </main>

    <script type="module">
      import { initLoginPage, initSiteAuth } from "/js/site-auth.js?v=auth20260725reg";
      initSiteAuth();
      initLoginPage();
    </script>
  </body>
</html>
