    <text x="120" y="99">Várpalota</text>
    <circle cx="195" cy="130" r="3" fill="#555"/>
    <text x="145" y="134">Polgárdi</text>
  </g>
  <!-- felhasználó pozíció jel -->
  <circle cx="280" cy="175" r="16" fill="#1565c0" opacity="0.18"/>
  <circle cx="280" cy="175" r="6" fill="#1565c0" stroke="#fff" stroke-width="2"/>
