    <circle cx="520" cy="175" r="4" fill="#1565c0"/>
    <text x="530" y="179" font-weight="700">Dabas</text>
    <circle cx="285" cy="108" r="3" fill="#555"/>
    <text x="295" y="102">Velence</text>
    <circle cx="255" cy="145" r="3" fill="#555"/>
    <text x="205" y="150">Gárdony</text>
    <circle cx="235" cy="168" r="3" fill="#555"/>
    <text x="190" y="173">Pusztaszabolcs</text>
    <circle cx="455" cy="155" r="3" fill="#555"/>
    <text x="465" y="159">Adony</text>
    <circle cx="485" cy="210" r="3" fill="#555"/>
