<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Térkép: Székesfehérvár, Velencei-tó, Dabas környéke">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="100%" stop-color="#f5f7fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- zöld mezQk -->
  <path fill="#dcedc8" d="M0 0h640v360H0z"/>
  <path fill="#c8e6c9" d="M40 40h260v140H40z M360 20h240v180H360z M20 200h300v140H20z M380 210h240v130H380z"/>
  <!-- utak -->
  <path stroke="#fff" stroke-width="6" fill="none" d="M30 180h580"/>
  <path stroke="#ffd180" stroke-width="4" fill="none" d="M120 30v300"/>
  <path stroke="#fff" stroke-width="4" fill="none" d="M200 60 L420 300"/>
  <!-- Velencei-tó -->
  <ellipse cx="300" cy="115" rx="78" ry="34" fill="#81d4fa" opacity="0.85"/>
  <text x="300" y="118" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" fill="#01579b">Velencei-tó</text>
  <!-- Duna -->
  <path stroke="#4fc3f7" stroke-width="14" fill="none" opacity="0.75" d="M470 20 C500 120 455 220 430 340"/>
  <text x="498" y="170" font-family="Inter,Arial,sans-serif" font-size="11" fill="#0277bd" transform="rotate(78 498 170)">Duna</text>
  <!-- városok -->
  <g font-family="Inter,Arial,sans-serif" font-size="10" fill="#333">
    <circle cx="115" cy="175" r="5" fill="#1565c0"/>
