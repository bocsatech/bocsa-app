<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="autosweb-version" content="automax20260719home" />
    <title>Autosweb — Feladott hirdetések</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=automax20260719home" />
    <link rel="stylesheet" href="/css/home.css?v=automax20260719home" />
  </head>
  <body class="home-page">
    <div class="local-banner">LOCALHOST — feladott hirdetések főoldala</div>

    <header class="site-header home-header">
      <div class="header-top home-header-top">
        <a class="home-logo" href="/">Autosweb</a>
        <nav class="home-nav" aria-label="Oldalak">
          <a class="home-nav-link active" href="/">Főoldal</a>
          <a class="home-nav-link" href="/import.html">Import</a>
          <a class="home-nav-link" href="/hirdetesfeladas.html">Hirdetésfeladás</a>
          <a class="home-nav-link" href="/listings.html">Hirdetések</a>
        </nav>
      </div>
      <div class="home-search-wrap">
        <form id="home-search-form" class="home-search-form" role="search">
          <label class="visually-hidden" for="home-search">Keresés</label>
          <svg class="home-search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13 13 18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input
            id="home-search"
            class="home-search-input"
            type="search"
            placeholder="Keresés gyártmány, modell, település, ár…"
            autocomplete="off"
          />
        </form>
        <p id="home-result-count" class="home-result-count"></p>
      </div>
    </header>

    <main class="home-main">
      <div class="home-layout">
        <aside class="home-side home-side--left" data-home-side="left">
          <div class="home-side-card">
            <h2 class="home-side-title" data-side-title>Kiemelt ajánlatok</h2>
            <div class="home-side-body" data-side-body></div>
          </div>
        </aside>

        <section class="home-center" aria-label="Feladott hirdetések">
          <div id="home-grid" class="home-grid"></div>
          <p id="home-empty" class="home-empty" hidden>
            Még nincs feladott hirdetés. A hirdetésfeladás varázslóban véglegesíts egy hirdetést, vagy módosítsd a szűrést.
          </p>
        </section>

        <aside class="home-side home-side--right" data-home-side="right">
          <div class="home-side-card">
            <h2 class="home-side-title" data-side-title>Hasznos információk</h2>
            <div class="home-side-body" data-side-body></div>
          </div>
        </aside>
      </div>

      <div id="home-side-toolbar" class="home-side-toolbar" hidden>
        <button type="button" class="home-side-btn" id="home-side-save">Tartalom mentése</button>
        <button type="button" class="home-side-btn home-side-btn--ghost" id="home-side-cancel">Mégse</button>
      </div>
      <button type="button" class="home-side-edit" id="home-side-edit">Oldalsávok szerkesztése</button>
    </main>

    <script src="/js/home-app.js?v=automax20260719home" type="module"></script>
  </body>
</html>
