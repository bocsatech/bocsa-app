<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="autosweb-version" content="automax20260719fixbar" />
    <title>Autosweb — Feladott hirdetések</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=automax20260719fixbar" />
    <link rel="stylesheet" href="/css/home.css?v=automax20260719fixbar" />
    <link rel="stylesheet" href="/css/site-side.css?v=automax20260719fixbar" />
  </head>
  <body class="home-page site-page" data-site-page="home">
    <div class="local-banner">LOCALHOST — feladott hirdetések főoldala</div>

    <header class="site-header home-header">
      <div class="header-top home-header-top">
        <a class="home-logo" href="/">Autosweb</a>
        <nav class="home-nav" aria-label="Oldalak">
          <a class="home-nav-link active" href="/">Főoldal</a>
          <a class="home-nav-link" href="/import.html">Import</a>
          <a class="home-nav-link" href="/hirdetesfeladas.html">Hirdetésfeladás</a>
          <a class="home-nav-link" href="/listings.html">Hirdetések</a>
        </nav>
      </div>
      <div class="home-search-wrap">
        <form id="home-search-form" class="home-search-form" role="search">
          <label class="visually-hidden" for="home-search">Keresés</label>
          <svg class="home-search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13 13 18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="home-search" class="home-search-input" type="search" placeholder="Keresés gyártmány, modell, település, ár…" autocomplete="off" />
        </form>
        <p id="home-result-count" class="home-result-count"></p>
      </div>
    </header>

    <main class="home-main">
      <div class="site-layout home-layout">
        <aside class="site-side site-side--left" data-site-side="left">
          <div class="site-side-card">
            <h2 class="site-side-title" data-side-title>Videók</h2>
            <div class="site-video-list" data-side-videos></div>
          </div>
        </aside>

        <section class="site-center home-center" aria-label="Feladott hirdetések">
          <div class="home-listings-panel">
            <div id="home-grid-viewport" class="home-grid-viewport">
              <div id="home-grid-track" class="home-grid-track"></div>
            </div>
            <div id="home-grid-indicators" class="home-grid-indicators" hidden></div>
            <p id="home-empty" class="home-empty" hidden>
              Még nincs hirdetés. Importálj és mentsd az adatbázisba, vagy fejezd be a hirdetésfeladás varázslót — utána itt jelennek meg a kártyák.
            </p>
          </div>

          <div class="home-active-content" data-center-content>
            <h2 class="home-active-title" data-center-title>Aktív tartalom</h2>
            <div class="home-active-body" data-center-body></div>
          </div>
        </section>

        <aside class="site-side site-side--right" data-site-side="right">
          <div class="site-side-card">
            <h2 class="site-side-title" data-side-title>Videók</h2>
            <div class="site-video-list" data-side-videos></div>
          </div>
        </aside>
      </div>
    </main>

    <footer class="site-content-bar" id="site-content-bar" aria-label="Tartalom szerkesztése">
      <div class="site-content-bar-inner">
        <button type="button" class="site-side-edit" id="site-side-edit">Tartalom szerkesztése</button>
        <div id="site-side-toolbar" class="site-side-toolbar" hidden>
          <button type="button" class="site-side-btn" id="site-side-save">Tartalom mentése</button>
          <button type="button" class="site-side-btn site-side-btn--ghost" id="site-side-cancel">Mégse</button>
        </div>
      </div>
    </footer>

    <script src="/js/home-app.js?v=automax20260719fixbar" type="module"></script>
  </body>
</html>
