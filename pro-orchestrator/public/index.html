<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Pro Orchestrator</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151d30;
      --border: #2a3550;
      --text: #e8edf7;
      --muted: #8b9cb3;
      --wh: #1db954;
      --ha: #ff6b35;
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    h1 { margin: 0; font-size: 1.2rem; }
    .version { color: var(--muted); font-size: 12px; }
    .banner {
      margin: 16px 24px 0;
      padding: 12px 16px;
      border: 1px solid #5b8cff55;
      background: #5b8cff18;
      border-radius: 10px;
      color: #b8ccff;
    }
    main {
      padding: 20px 24px 32px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 1100px) { main { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
    .slot {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: grid;
      gap: 10px;
    }
    .slot.running { border-color: #1db95466; }
    .slot header {
      padding: 0; border: 0; margin: 0;
      display: flex; justify-content: space-between; align-items: center;
    }
    .slot h2 { margin: 0; font-size: 1rem; }
    .pill {
      font-size: 11px; font-weight: 700; padding: 3px 8px;
      border-radius: 999px; text-transform: uppercase;
    }
    .pill.wh { background: #1db95433; color: var(--wh); }
    .pill.ha { background: #ff6b3533; color: var(--ha); }
    .status { font-size: 12px; color: var(--muted); }
    .status.run { color: var(--wh); }
    label {
      display: block; font-size: 11px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px;
    }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: #0b1020; color: var(--text); font: inherit;
    }
    .log {
      min-height: 120px; max-height: 160px; overflow: auto;
      background: #080d18; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; font: 11px/1.45 ui-monospace, monospace; color: #b8c4d9;
    }
    .log div { margin: 1px 0; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: #24304a; color: var(--text); font-weight: 600; cursor: pointer;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.danger { background: #e74c3c33; color: #ff9f9f; border-color: #e74c3c55; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    footer {
      padding: 0 24px 24px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .dirty { color: #ffb347; font-size: 12px; display: none; }
    .dirty.show { display: inline; }
    .admin-link { font-size: 12px; color: #8ecfff; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Pro Orchestrator</h1>
      <div class="version" id="version"></div>
    </div>
    <div>http://127.0.0.1:<span id="port">3850</span></div>
  </header>

  <div class="banner">
    Slotonként külön port (3851–3856) és <strong>külön Chrome profil</strong> (külön bejelentkezés).
    Felhasználónév = willhaben login (Hasznaltauto slotnál azonosító). Először: <strong>Bejelentkezés</strong>, majd <strong>Indítás</strong>.
  </div>

  <main id="slots"></main>

  <footer>
    <span class="dirty" id="dirty">⚠ Nem mentett változások</span>
    <button class="primary" onclick="saveAll()">💾 Összes slot mentése</button>
  </footer>

  <script>
    let data = null;
    let dirty = false;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[c]);
    }

    function markDirty() {
      dirty = true;
      document.getElementById('dirty').classList.add('show');
    }

    function runtimeFor(id) {
      return (data?.runtime || []).find((r) => r.id === id) || {};
    }

    function renderSlots(slots) {
      const root = document.getElementById('slots');
      root.innerHTML = slots.map((slot, i) => {
        const rt = runtimeFor(slot.id);
        const pillClass = slot.program === 'hasznaltauto' ? 'ha' : 'wh';
        const pillText = slot.program === 'hasznaltauto' ? 'Hasznaltauto' : 'Willhaben';
        const running = !!rt.running;
        return `
          <section class="slot ${running ? 'running' : ''}" data-slot="${i}" id="card-${slot.id}">
            <header>
              <h2>${esc(slot.label || `Slot ${i + 1}`)}</h2>
              <span class="pill ${pillClass}" id="pill-${i}">${pillText}</span>
            </header>

            <div class="status ${running ? 'run' : ''}" id="status-${slot.id}">
              ${running ? `● Fut — :${rt.port}` : '○ Leállítva'}
              ${rt.adminUrl ? ` — <a class="admin-link" href="${rt.adminUrl}" target="_blank">admin</a>` : ''}
            </div>

            <div>
              <label>Program</label>
              <select class="program" data-i="${i}" onchange="onProgramChange(${i})" ${running ? 'disabled' : ''}>
                <option value="willhaben" ${slot.program === 'willhaben' ? 'selected' : ''}>Willhaben Pro</option>
                <option value="hasznaltauto" ${slot.program === 'hasznaltauto' ? 'selected' : ''}>Hasznaltauto Pro</option>
              </select>
            </div>

            <div>
              <label>Felhasználónév (willhaben login)</label>
              <input class="username" data-i="${i}" value="${esc(slot.username)}" placeholder="pl. pelda.felhasznalo" oninput="markDirty()" ${running ? 'disabled' : ''} />
            </div>

            <div>
              <label>Napló</label>
              <div class="log" id="log-${slot.id}">Betöltés…</div>
            </div>

            <div class="btns">
              <button class="primary" onclick="startSlot('${slot.id}')" ${running ? 'disabled' : ''}>▶ Indítás</button>
              <button class="danger" onclick="stopSlot('${slot.id}')" ${running ? '' : 'disabled'}>■ Leállítás</button>
              <button onclick="loginSlot('${slot.id}')" ${running ? 'disabled' : ''}>🔑 Bejelentkezés</button>
            </div>
          </section>
        `;
      }).join('');
      slots.forEach((s) => refreshLogs(s.id));
    }

    function onProgramChange(i) {
      const sel = document.querySelector(`.program[data-i="${i}"]`);
      const pill = document.getElementById(`pill-${i}`);
      const isHa = sel.value === 'hasznaltauto';
      pill.textContent = isHa ? 'Hasznaltauto' : 'Willhaben';
      pill.className = 'pill ' + (isHa ? 'ha' : 'wh');
      markDirty();
    }

    function collectSlots() {
      return [...document.querySelectorAll('.slot')].map((el, i) => ({
        id: data.slots[i]?.id || `slot-${i + 1}`,
        label: `Slot ${i + 1}`,
        program: document.querySelector(`.program[data-i="${i}"]`).value,
        username: document.querySelector(`.username[data-i="${i}"]`).value.trim(),
      }));
    }

    async function refresh({ keepForm = false } = {}) {
      const res = await fetch('/api/status');
      data = await res.json();
      document.getElementById('version').textContent = `v${data.version}`;
      document.getElementById('port').textContent = data.port;
      if (!dirty || !keepForm) renderSlots(data.slots);
      else {
        for (const slot of data.slots) {
          const rt = runtimeFor(slot.id);
          const st = document.getElementById(`status-${slot.id}`);
          if (st) {
            st.className = 'status ' + (rt.running ? 'run' : '');
            st.innerHTML = rt.running
              ? `● Fut — :${rt.port} — <a class="admin-link" href="${rt.adminUrl}" target="_blank">admin</a>`
              : '○ Leállítva';
          }
          refreshLogs(slot.id);
        }
      }
    }

    async function refreshLogs(slotId) {
      const el = document.getElementById(`log-${slotId}`);
      if (!el) return;
      try {
        const res = await fetch(`/api/slots/${slotId}/logs`);
        const body = await res.json();
        el.innerHTML = (body.logs || []).map((l) => `<div>${esc(l)}</div>`).join('') || '—';
      } catch {
        el.textContent = '— napló hiba —';
      }
    }

    async function saveAll() {
      const res = await fetch('/api/slots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slots: collectSlots() }),
      });
      if (!res.ok) return alert('Mentés sikertelen');
      dirty = false;
      document.getElementById('dirty').classList.remove('show');
      await refresh();
      alert('Mentve!');
    }

    async function startSlot(id) {
      if (dirty) {
        if (!confirm('Nem mentett változások vannak. Mentsem előbb?')) return;
        await saveAll();
      }
      const res = await fetch(`/api/slots/${id}/start`, { method: 'POST' });
      const body = await res.json();
      if (!res.ok) return alert(body.error || 'Indítás sikertelen');
      await refresh();
    }

    async function stopSlot(id) {
      await fetch(`/api/slots/${id}/stop`, { method: 'POST' });
      await refresh();
    }

    async function loginSlot(id) {
      const res = await fetch(`/api/slots/${id}/login`, { method: 'POST' });
      const body = await res.json();
      alert(body.message || body.error || 'Bejelentkezés');
    }

    refresh();
    setInterval(() => refresh({ keepForm: true }), 4000);
  </script>
</body>
</html>
