<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='system-ui,sans-serif' font-weight='700'%3EB%3C/text%3E%3C/svg%3E" type="image/svg+xml" />
    <meta name="bymy-version" content="auth20260725reg" />
    <title>Belépés — Bymy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css?v=auth20260725" />
    <link rel="stylesheet" href="/css/site-app.css?v=settingsMobile1" />
  </head>
  <body class="site-app login-page" data-site-page="belepes" data-auth-init="manual">
    <div class="local-banner">Bymy — belépés a hirdetésfeladáshoz</div>

    <header class="site-header site-app-header">
      <div class="site-app-header-inner">
                <a class="site-app-logo" href="/">Bymy</a>
        <nav class="import-nav site-app-nav" aria-label="Főmenü">
          <a class="import-nav-link active" href="/">Kezdőlap</a>
          <a class="import-nav-link" href="/auto.html">Auto</a>
          <a class="import-nav-link" href="/teherauto.html">Teherauto</a>
          <a class="import-nav-link" href="/ingatlan.html">Ingatlan</a>
          <a class="import-nav-link" href="/partners.html">Ajánlások</a>
          <a class="import-nav-link" href="/beallitasok.html?szekcio=uzenetek">Üzenetek</a>
          <a class="import-nav-link" href="/beallitasok.html">Beállítások</a>
        </nav>
        <div class="header-actions site-header-actions">
          <div class="site-header-auth-row">
            <a class="site-header-btn site-header-btn--ghost" href="/belepes.html" data-auth-login>Belépés</a>
            <a class="site-header-btn site-header-btn--ghost" href="/regisztracio.html" data-auth-register>Regisztráció</a>
            <a class="site-header-btn site-header-btn--ghost" href="/hirdetesfeladas.html" data-auth-guard>Hirdetésfeladás</a>
          </div>
        </div>
      </div>
    </header>

    <main class="login-main">
      <section class="login-card" aria-labelledby="login-title">
        <h1 class="login-title" id="login-title">Belépés</h1>
        <p class="login-lead">A hirdetésfeladáshoz jelentkezz be a fiókodba.</p>
        <div class="oauth-block" data-oauth-buttons>
          <button type="button" class="oauth-btn oauth-btn--google" data-oauth-provider="google">
            <span class="oauth-btn-icon" aria-hidden="true">G</span>
            Folytatás Google-lal
          </button>
          <button type="button" class="oauth-btn oauth-btn--apple" data-oauth-provider="apple">
            <span class="oauth-btn-icon" aria-hidden="true"></span>
            Folytatás Apple-lel
          </button>
          <button type="button" class="oauth-btn oauth-btn--facebook" data-oauth-provider="facebook">
            <span class="oauth-btn-icon" aria-hidden="true">f</span>
            Folytatás Facebookkal
          </button>
          <p class="oauth-hint" data-oauth-hint hidden></p>
        </div>
        <div class="login-divider" aria-hidden="true"><span>vagy emaillel</span></div>
        <form id="login-form" class="login-form">
          <label class="login-field">
            <span class="login-label">Email</span>
            <input type="email" name="email" autocomplete="username" required placeholder="pelda@email.hu" />
          </label>
          <label class="login-field">
            <span class="login-label">Jelszó</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button type="submit" class="site-header-btn site-header-btn--primary login-submit">Belépés</button>
        </form>
        <p class="login-hint">Nincs még fiókod? <a href="/regisztracio.html">Regisztráció</a> · Localhost demó</p>
      </section>
    </main>

    <script src="/js/site-avatar-menu.js?v=fiokMenu2" type="module"></script>
    <script type="module">
      import { initLoginPage, initSiteAuth } from "/js/site-auth.js?v=auth20260806oauth1";
      initSiteAuth();
      initLoginPage();
    </script>
  </body>
</html>
