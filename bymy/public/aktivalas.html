<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='14' font-family='system-ui,sans-serif' font-weight='700'%3EB%3C/text%3E%3C/svg%3E" type="image/svg+xml" />
    <meta name="bymy-version" content="auth20260805mail1" />
    <title>Fiók aktiválása — Bymy</title>
    <link rel="stylesheet" href="/css/style.css?v=auth20260805mail1" />
    <link rel="stylesheet" href="/css/site-app.css?v=navNoLogo1" />
  </head>
  <body class="site-app login-page" data-site-page="aktivalas" data-auth-init="manual">
    <div class="local-banner">Bymy — email aktiválás</div>
    <header class="site-header site-app-header">
      <div class="site-app-header-inner">
        <nav class="import-nav site-app-nav" aria-label="Főmenü">
          <a class="import-nav-link" href="/">Kezdőlap</a>
          <a class="import-nav-link" href="/auto.html">Autó</a>
          <a class="import-nav-link" href="/teherauto.html">Teherautó</a>
          <a class="import-nav-link" href="/ingatlan.html">Ingatlan</a>
          <a class="import-nav-link" href="/ajanlasok.html">Ajánlások</a>
          <a class="import-nav-link" href="/beallitasok.html?szekcio=uzenetek">Üzenetek</a>
          <a class="import-nav-link" href="/beallitasok.html">Beállítások</a>
        </nav>
      </div>
    </header>
    <main class="login-main">
      <section class="login-card" aria-labelledby="activate-title">
        <h1 class="login-title" id="activate-title">Fiók aktiválása</h1>
        <p class="login-lead">Ha az emailben lévő linkre kattintottál, az aktiválás automatikus. Ha nem kaptál levelet, küldd újra.</p>
        <p id="activate-status" class="login-lead" role="status" hidden></p>
        <form id="resend-form" class="login-form">
          <label class="login-field">
            <span class="login-label">Email</span>
            <input type="email" name="email" required placeholder="pelda@email.hu" />
          </label>
          <button type="submit" class="site-header-btn site-header-btn--primary login-submit">Aktiváló email újraküldése</button>
        </form>
        <p class="login-hint"><a href="/belepes.html">Belépés</a> · <a href="/regisztracio.html">Regisztráció</a></p>
      </section>
    </main>
    <script type="module">
      import { initActivatePage } from "/js/site-auth.js?v=auth20260805mail1";
      initActivatePage();
    </script>
      <script src="/js/nav-counts.js?v=navNoLogo1" type="module"></script>
  </body>
</html>
