# Deploy main → Vercel Production
# 1) bocsa-app (Next.js CRM)
# 2) bymy.vercel.app — teljes app API-val (bocsatech/bymy) + UI overlay ebből a repóból
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Hiányzik: VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "::error::Hiányzik: VERCEL_ORG_ID"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Hiányzik: VERCEL_PROJECT_ID"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Deploy bocsa-app (CRM) to Vercel
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Bymy (API + UI) to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_aePUcCV4V7oLKwxxHnuOYupl1QlN
        run: |
          set -euo pipefail

          echo "bocsatech/bymy klónozása (API + Supabase auth)…"
          rm -rf /tmp/bymy-prod
          git clone --depth 1 https://github.com/bocsatech/bymy.git /tmp/bymy-prod

          echo "UI overlay ebből a repóból (hub, kategóriaválasztó, …)…"
          cp -a bymy/public/. /tmp/bymy-prod/public/

          echo "Messages API overlay (jelentés / schema)…"
          mkdir -p /tmp/bymy-prod/lib
          cp bymy/lib/messaging.mjs /tmp/bymy-prod/lib/messaging.mjs

          echo "SMTP overlay (env: SMTP_USER / SMTP_PASS a Vercel projekten)…"
          if [ -f bymy/lib/mail.mjs ]; then
            cp bymy/lib/mail.mjs /tmp/bymy-prod/lib/mail.mjs
          fi

          echo "Profil oszlopok overlay (supabase/users.mjs)…"
          if [ -f bymy/lib/supabase/users.mjs ]; then
            mkdir -p /tmp/bymy-prod/lib/supabase
            cp bymy/lib/supabase/users.mjs /tmp/bymy-prod/lib/supabase/users.mjs
          fi

          # Bridge tükör (opcionális helyi/alias használatra)
          mkdir -p autosweb/public
          cp -a bymy/public/. autosweb/public/

          echo "Deploy bymy-prod → ${VERCEL_PROJECT_ID}"
          cd /tmp/bymy-prod
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
