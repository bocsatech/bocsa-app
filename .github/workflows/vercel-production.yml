# Deploy main → Vercel Production
# 1) bocsa-app (Next.js CRM)
# 2) bymy.vercel.app — teljes app API-val (bocsatech/bymy) + UI overlay ebből a repóból
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      set_smtp:
        description: "Állítsd be / frissítsd a bymy SMTP env-eket a Vercelen"
        type: boolean
        default: false
      smtp_user:
        description: "SMTP_USER (pl. Gmail cím)"
        type: string
        required: false
        default: ""
      smtp_pass:
        description: "SMTP_PASS (Gmail app jelszó)"
        type: string
        required: false
        default: ""
      smtp_from:
        description: "SMTP_FROM"
        type: string
        required: false
        default: "Bymy <bocsa.robert@gmail.com>"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Hiányzik: VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ]; then
            echo "::error::Hiányzik: VERCEL_ORG_ID"
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Hiányzik: VERCEL_PROJECT_ID"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set bymy SMTP env on Vercel (optional)
        if: ${{ inputs.set_smtp == true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          BYMY_PROJECT_ID: prj_aePUcCV4V7oLKwxxHnuOYupl1QlN
          SMTP_USER: ${{ inputs.smtp_user }}
          SMTP_PASS: ${{ inputs.smtp_pass }}
          SMTP_FROM: ${{ inputs.smtp_from }}
        run: |
          set -euo pipefail
          if [ -z "${SMTP_USER}" ] || [ -z "${SMTP_PASS}" ]; then
            echo "::error::set_smtp=true, de smtp_user / smtp_pass üres"
            exit 1
          fi
          python3 <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          fallback_team = os.environ.get("VERCEL_ORG_ID") or ""
          proj = os.environ["BYMY_PROJECT_ID"]
          pairs = [
              ("SMTP_USER", os.environ["SMTP_USER"].strip()),
              ("SMTP_PASS", os.environ["SMTP_PASS"].replace(" ", "")),
              ("SMTP_FROM", (os.environ.get("SMTP_FROM") or "").strip() or f"Bymy <{os.environ['SMTP_USER'].strip()}>"),
          ]

          def req(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              r = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(r) as res:
                      raw = res.read().decode()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode()
                  raise SystemExit(f"{method} {url} -> {e.code}: {detail}") from e

          project = None
          team = fallback_team
          for candidate in [fallback_team, ""]:
              q = f"?teamId={candidate}" if candidate else ""
              try:
                  project = req("GET", f"https://api.vercel.com/v9/projects/{proj}{q}")
                  if candidate:
                      team = candidate
                  elif project.get("accountId"):
                      team = project["accountId"]
                  break
              except SystemExit as err:
                  print(f"project lookup failed team={candidate or 'none'}: {err}")
          if not project:
              raise SystemExit("Could not load bymy project with VERCEL_TOKEN")

          print(f"bymy project={project.get('name')} team={team}")

          listed = req("GET", f"https://api.vercel.com/v9/projects/{proj}/env?teamId={team}")
          envs = listed.get("envs") or []

          for key, value in pairs:
              for e in envs:
                  if e.get("key") == key and "production" in (e.get("target") or []):
                      eid = e["id"]
                      req("DELETE", f"https://api.vercel.com/v9/projects/{proj}/env/{eid}?teamId={team}")
                      print(f"deleted existing {key}")
              created = req(
                  "POST",
                  f"https://api.vercel.com/v10/projects/{proj}/env?teamId={team}",
                  {
                      "key": key,
                      "value": value,
                      "type": "encrypted",
                      "target": ["production"],
                  },
              )
              print(f"upserted {key}: {created.get('id') or 'ok'}")

          print("SMTP env beállítva a bymy production projekten.")
          PY

      - name: Deploy bocsa-app (CRM) to Vercel
        continue-on-error: true
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Bymy (API + UI) to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: prj_aePUcCV4V7oLKwxxHnuOYupl1QlN
        run: |
          set -euo pipefail

          echo "bocsatech/bymy klónozása (API + Supabase auth)…"
          rm -rf /tmp/bymy-prod
          git clone --depth 1 https://github.com/bocsatech/bymy.git /tmp/bymy-prod

          echo "UI overlay ebből a repóból (hub, kategóriaválasztó, …)…"
          cp -a bymy/public/. /tmp/bymy-prod/public/

          echo "Messages API overlay (jelentés / schema)…"
          mkdir -p /tmp/bymy-prod/lib
          cp bymy/lib/messaging.mjs /tmp/bymy-prod/lib/messaging.mjs

          echo "SMTP overlay (env: SMTP_USER / SMTP_PASS a Vercel projekten)…"
          if [ -f bymy/lib/mail.mjs ]; then
            cp bymy/lib/mail.mjs /tmp/bymy-prod/lib/mail.mjs
          fi

          echo "Profil oszlopok overlay (supabase/users.mjs)…"
          if [ -f bymy/lib/supabase/users.mjs ]; then
            mkdir -p /tmp/bymy-prod/lib/supabase
            cp bymy/lib/supabase/users.mjs /tmp/bymy-prod/lib/supabase/users.mjs
          fi

          echo "Aktiválás: email-megnyitás (open pixel) patch…"
          if [ -f bymy/scripts/patch-activation-open.mjs ]; then
            node bymy/scripts/patch-activation-open.mjs /tmp/bymy-prod/server.mjs
          fi

          # Bridge tükör (opcionális helyi/alias használatra)
          mkdir -p autosweb/public
          cp -a bymy/public/. autosweb/public/

          echo "Deploy bymy-prod → ${VERCEL_PROJECT_ID}"
          cd /tmp/bymy-prod
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
