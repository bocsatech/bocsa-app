<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Willhaben Agent</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">WA</span>
      <div>
        <strong>Willhaben Agent</strong>
        <span class="sub" id="statusLine">Betöltés…</span>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" id="btnSync" class="btn primary">↻ Üzenetek frissítése</button>
      <label class="btn ghost file-btn">
        Árdiagram feltöltés
        <input type="file" id="chartFile" accept=".csv,.json,.txt" hidden />
      </label>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Beszélgetések</h2>
        <span id="convCount" class="badge">0</span>
      </div>
      <div id="convList" class="conv-list"></div>
    </aside>

    <section class="thread">
      <div id="threadEmpty" class="empty">
        <p>Válassz egy beszélgetést, vagy frissítsd az üzeneteket.</p>
      </div>
      <div id="threadPanel" class="thread-panel hidden">
        <header class="thread-head">
          <div>
            <h2 id="threadTitle">—</h2>
            <p id="threadAd" class="muted"></p>
          </div>
          <div id="priceHint" class="price-hint hidden"></div>
        </header>
        <div id="messages" class="messages"></div>
        <form id="replyForm" class="reply-form">
          <textarea id="replyText" rows="4" placeholder="Új üzenet írása…"></textarea>
          <div class="reply-actions">
            <span class="hint">Enter = küldés · Shift+Enter = új sor</span>
            <button type="submit" class="btn primary">Küldés</button>
          </div>
        </form>
      </div>
    </section>

    <aside class="chart-panel">
      <h2>Árdiagram</h2>
      <p class="muted small">CSV vagy JSON — oszlopok: marke, modell, baujahr, km, wert (EUR)</p>
      <div id="chartMeta" class="chart-meta muted">Még nincs feltöltve.</div>
      <div class="chart-table-wrap">
        <table id="chartTable" class="chart-table hidden">
          <thead>
            <tr>
              <th>Márka</th>
              <th>Modell</th>
              <th>Év</th>
              <th>Km</th>
              <th>Érték €</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <button type="button" id="btnClearChart" class="btn ghost hidden">Diagram törlése</button>
    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
